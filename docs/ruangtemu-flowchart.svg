<svg viewBox="0 0 1140 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram Alur Proses Photobooth RUANGTEMU">
      <defs>
        <!-- Background Pattern -->
        <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="rgba(15, 23, 42, 0.07)"/>
        </pattern>

        <!-- Arrow Markers -->
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
        </marker>
        <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
        </marker>
        <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
        </marker>
      </defs>

      <!-- Background Wash -->
      <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
      <rect width="100%" height="100%" fill="url(#dot-grid)"/>

      <!-- ========================================================================= -->
      <!-- ZONES / STAGES (DRAWN FIRST)                                              -->
      <!-- ========================================================================= -->

      <!-- Stage 1 Zone -->
      <rect x="30" y="30" width="310" height="520" rx="8"
            fill="rgba(15, 23, 42, 0.015)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="75" y="34" width="220" height="13" rx="2" fill="#ffffff"/>
      <text x="185" y="44" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" font-weight="600" letter-spacing="0.12em">TAHAP 1: ONBOARDING &amp; SETUP</text>

      <!-- Stage 2 Zone -->
      <rect x="380" y="30" width="370" height="520" rx="8"
            fill="rgba(15, 23, 42, 0.015)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="445" y="34" width="240" height="13" rx="2" fill="#ffffff"/>
      <text x="565" y="44" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" font-weight="600" letter-spacing="0.12em">TAHAP 2: CAPTURE &amp; COMPOSITING</text>

      <!-- Stage 3 Zone -->
      <rect x="790" y="30" width="320" height="520" rx="8"
            fill="rgba(15, 23, 42, 0.015)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="835" y="34" width="230" height="13" rx="2" fill="#ffffff"/>
      <text x="950" y="44" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" font-weight="600" letter-spacing="0.12em">TAHAP 3: GUESTBOOK &amp; PERSISTENSI</text>

      <!-- ========================================================================= -->
      <!-- CONNECTORS (DRAWN BEHIND NODES)                                           -->
      <!-- ========================================================================= -->

      <!-- Stage 1 Downward Lines -->
      <line x1="185" y1="104" x2="185" y2="135" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="185" y1="195" x2="185" y2="225" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="185" y1="285" x2="185" y2="315" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="185" y1="375" x2="185" y2="405" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Stage 1 -> Stage 2 (From Camera Init to Countdown) -->
      <path d="M 295,435 H 350 Q 360,435 360,425 V 95 Q 360,85 370,85 H 440"
            fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-accent)"/>
      <rect x="334" y="240" width="52" height="13" rx="2" fill="#ffffff"/>
      <text x="360" y="250" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">START</text>

      <!-- Stage 2 Downward Lines -->
      <line x1="550" y1="115" x2="550" y2="145" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="550" y1="205" x2="550" y2="235" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="550" y1="300" x2="550" y2="330" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Decision Diamond Branches: -->
      <!-- Branch A: TIDAK (Retake Loop - Coral/Amber) -->
      <path d="M 470,370 H 420 Q 410,370 410,360 V 95 Q 410,85 420,85 H 440"
            fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-amber)"/>
      <rect x="382" y="358" width="46" height="13" rx="2" fill="#ffffff"/>
      <text x="405" y="368" fill="#d97706" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">RETAKE</text>

      <!-- Branch B: YA / LANJUT (To Stage 3 Guestbook) -->
      <path d="M 630,370 H 745 Q 755,370 755,360 V 95 Q 755,85 765,85 H 835"
            fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow-emerald)"/>
      <rect x="732" y="225" width="46" height="13" rx="2" fill="#ffffff"/>
      <text x="755" y="235" fill="#059669" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">LANJUT</text>

      <!-- Stage 3 Downward Lines -->
      <line x1="945" y1="115" x2="945" y2="145" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="945" y1="205" x2="945" y2="235" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="945" y1="300" x2="945" y2="330" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow-emerald)"/>
      <line x1="945" y1="395" x2="945" y2="430" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow-emerald)"/>

      <!-- ========================================================================= -->
      <!-- NODES: TAHAP 1 ONBOARDING                                                 -->
      <!-- ========================================================================= -->

      <!-- 1. Start: Scan QR -->
      <rect x="75" y="60" width="220" height="44" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="185" y="87" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">
        1. Scan QR Code di Meja
      </text>

      <!-- 2. SSR Event Hydration -->
      <rect x="75" y="135" width="220" height="60" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="83" y="141" width="34" height="11" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="100" y="149" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">SERVER</text>
      <text x="85" y="170" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">2. SSR Hydration &amp; Validasi</text>
      <text x="85" y="184" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">getEventBySlug() · Status Cek</text>

      <!-- 3. Input Nama Tamu -->
      <rect x="75" y="225" width="220" height="60" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="83" y="231" width="32" height="11" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="99" y="239" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">INPUT</text>
      <text x="85" y="260" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">3. Input Nama Tamu</text>
      <text x="85" y="274" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Tanpa Login · Auto-Capitalize</text>

      <!-- 4. Pilih Template Frame -->
      <rect x="75" y="315" width="220" height="60" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="83" y="321" width="34" height="11" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="100" y="329" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">FRAME</text>
      <text x="85" y="350" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">4. Pilih Template Frame</text>
      <text x="85" y="364" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Strip 3-Foto / 4R Postcard</text>

      <!-- 5. Izin Kamera WebRTC -->
      <rect x="75" y="405" width="220" height="60" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="83" y="411" width="44" height="11" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="105" y="419" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CAMERA</text>
      <text x="85" y="440" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">5. Izinkan Akses Kamera</text>
      <text x="85" y="454" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">navigator.mediaDevices.getUserMedia</text>

      <!-- ========================================================================= -->
      <!-- NODES: TAHAP 2 CAPTURE & COMPOSITING                                      -->
      <!-- ========================================================================= -->

      <!-- 6. Countdown -->
      <rect x="445" y="60" width="210" height="55" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="453" y="66" width="36" height="11" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="471" y="74" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">TIMER</text>
      <text x="455" y="93" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">6. Countdown 3.. 2.. 1..</text>
      <text x="455" y="106" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Visual UI + Web Audio Chime</text>

      <!-- 7. Multi-shot Capture -->
      <rect x="445" y="145" width="210" height="60" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="453" y="151" width="46" height="11" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="476" y="159" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CAPTURE</text>
      <text x="455" y="179" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">7. Multi-Shot Capture</text>
      <text x="455" y="193" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Jepret 3x Foto Berurutan</text>

      <!-- 8. Canvas Compositor (Focal Accent) -->
      <rect x="445" y="235" width="210" height="65" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <rect x="453" y="241" width="44" height="11" rx="2" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(37, 99, 235, 0.40)" stroke-width="0.8"/>
      <text x="475" y="249" fill="#2563eb" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CANVAS</text>
      <text x="455" y="270" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">8. Canvas 2D Compositor</text>
      <text x="455" y="284" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Penggabungan Foto + Frame PNG</text>

      <!-- 9. Decision: Hasil Sesuai? (Diamond) -->
      <polygon points="550 330, 630 370, 550 410, 470 370"
               fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
      <text x="550" y="367" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">
        Puas Dengan
      </text>
      <text x="550" y="381" fill="#0f172a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">
        Hasil Foto?
      </text>

      <!-- ========================================================================= -->
      <!-- NODES: TAHAP 3 GUESTBOOK & PERSISTENSI                                    -->
      <!-- ========================================================================= -->

      <!-- 10. Tulis Ucapan & Voice Note -->
      <rect x="840" y="60" width="210" height="55" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="848" y="66" width="56" height="11" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="876" y="74" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">GUESTBOOK</text>
      <text x="850" y="94" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">10. Tulis Pesan Ucapan</text>
      <text x="850" y="107" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Pesan Teks + Voice Note (Opt)</text>

      <!-- 11. Client-Side Compression -->
      <rect x="840" y="145" width="210" height="60" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="848" y="151" width="50" height="11" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="873" y="159" fill="#475569" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">COMPRESS</text>
      <text x="850" y="179" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">11. Kompresi Payload</text>
      <text x="850" y="193" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Optimasi Base64 (&lt; 2.5 MB)</text>

      <!-- 12. HTTP POST API Route -->
      <rect x="840" y="235" width="210" height="65" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <rect x="848" y="241" width="52" height="11" rx="2" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(37, 99, 235, 0.40)" stroke-width="0.8"/>
      <text x="874" y="249" fill="#2563eb" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">REST POST</text>
      <text x="850" y="270" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">12. POST /api/.../entries</text>
      <text x="850" y="284" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">Sanitasi XSS &amp; Validasi Ukuran</text>

      <!-- 13. Simpan ke Database & S3 -->
      <rect x="840" y="330" width="210" height="65" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <rect x="848" y="336" width="56" height="11" rx="2" fill="rgba(5, 150, 105, 0.08)" stroke="rgba(5, 150, 105, 0.40)" stroke-width="0.8"/>
      <text x="876" y="344" fill="#059669" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">SUPABASE</text>
      <text x="850" y="365" fill="#0f172a" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif">13. Simpan DB &amp; Media S3</text>
      <text x="850" y="379" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">PostgreSQL + Storage Bucket</text>

      <!-- 14. Terminal End: Live Gallery -->
      <rect x="835" y="430" width="220" height="48" rx="24" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
      <text x="945" y="452" fill="#059669" font-size="12" font-weight="700" font-family="'Geist', sans-serif" text-anchor="middle">
        14. Selesai: Live Gallery
      </text>
      <text x="945" y="466" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">
        Download Softcopy Instan
      </text>

      <!-- ========================================================================= -->
      <!-- LEGEND BAR                                                                -->
      <!-- ========================================================================= -->
      <line x1="30" y1="575" x2="1110" y2="575" stroke="rgba(15, 23, 42, 0.10)" stroke-width="0.8"/>
      <text x="30" y="596" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">LEGENDA FLOWCHART</text>

      <rect x="180" y="588" width="22" height="10" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="210" y="596" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Titik Mulai (Start Node)</text>

      <rect x="345" y="588" width="12" height="10" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="365" y="596" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Langkah Utama (Core Action)</text>

      <polygon points="505 587, 513 593, 505 599, 497 593" fill="#ffffff" stroke="#475569" stroke-width="1"/>
      <text x="522" y="596" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Percabangan Keputusan</text>

      <line x1="655" y1="593" x2="680" y2="593" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-amber)"/>
      <text x="688" y="596" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Retake Loop (Foto Ulang)</text>

      <line x1="815" y1="593" x2="840" y2="593" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow-emerald)"/>
      <text x="848" y="596" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Jalur Sukses / Selesai</text>

      <rect x="975" y="588" width="22" height="10" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <text x="1005" y="596" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Hasil Akhir (Terminal End)</text>
    </svg>
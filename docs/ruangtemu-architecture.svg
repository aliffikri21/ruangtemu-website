<svg viewBox="0 0 1140 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram Arsitektur Sistem RUANGTEMU">
      <defs>
        <!-- Background Pattern -->
        <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="rgba(15, 23, 42, 0.07)"/>
        </pattern>

        <!-- Arrow Markers -->
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
        </marker>
        <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
        </marker>
      </defs>

      <!-- Background Wash -->
      <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
      <rect width="100%" height="100%" fill="url(#dot-grid)"/>

      <!-- ========================================================================= -->
      <!-- TIER 1: CLIENT TIER (TOUCHPOINTS)                                         -->
      <!-- ========================================================================= -->
      <rect x="30" y="40" width="250" height="460" rx="8"
            fill="rgba(15, 23, 42, 0.015)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="70" y="44" width="170" height="13" rx="2" fill="#ffffff"/>
      <text x="155" y="54" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" font-weight="600" letter-spacing="0.12em">1. CLIENT TIER (PWA &amp; PORTAL)</text>

      <!-- ========================================================================= -->
      <!-- TIER 2: APPLICATION & SECURITY EDGE TIER (NEXT.JS APP ROUTER)             -->
      <!-- ========================================================================= -->
      <rect x="320" y="40" width="450" height="460" rx="8"
            fill="rgba(15, 23, 42, 0.015)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="425" y="44" width="240" height="13" rx="2" fill="#ffffff"/>
      <text x="545" y="54" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" font-weight="600" letter-spacing="0.12em">2. APPLICATION &amp; SECURITY (NEXT.JS)</text>

      <!-- ========================================================================= -->
      <!-- TIER 3: DATA & STORAGE TIER (SUPABASE CLOUD)                              -->
      <!-- ========================================================================= -->
      <rect x="810" y="40" width="300" height="460" rx="8"
            fill="rgba(15, 23, 42, 0.015)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="875" y="44" width="170" height="13" rx="2" fill="#ffffff"/>
      <text x="960" y="54" fill="#64748b" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" font-weight="600" letter-spacing="0.12em">3. DATA TIER (POSTGRESQL)</text>

      <!-- ========================================================================= -->
      <!-- CONNECTORS (DRAWN BEHIND NODES)                                           -->
      <!-- ========================================================================= -->

      <!-- 1. Guest Smartphone -> Security Middleware (Scan QR / Buka Event) -->
      <path d="M 255,140 H 340"
            fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-accent)"/>
      <rect x="272" y="128" width="52" height="13" rx="2" fill="#ffffff"/>
      <text x="298" y="138" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">HTTPS GET</text>

      <!-- 2. Admin Dashboard -> Security Middleware (Login & Sesi Admin) -->
      <path d="M 255,370 H 295 Q 305,370 305,360 V 165 Q 305,155 315,155 H 340"
            fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="268" y="358" width="58" height="13" rx="2" fill="#ffffff"/>
      <text x="297" y="368" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">AUTH / LOGIN</text>

      <!-- 3. Security Middleware -> Server Component (Lolos Validasi) -->
      <path d="M 445,185 V 230"
            fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 4. Server Component -> PostgreSQL (Fetch getEventBySlug & SSR) -->
      <path d="M 545,265 H 830"
            fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
      <rect x="670" y="254" width="70" height="13" rx="2" fill="#ffffff"/>
      <text x="705" y="264" fill="#059669" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">SQL SELECT</text>

      <!-- 5. Guest Camera -> Canvas Compositor (Local Stream) -->
      <path d="M 255,160 H 290 Q 300,160 300,170 V 270 Q 300,280 310,280 H 565"
            fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
      <rect x="305" y="215" width="62" height="13" rx="2" fill="#ffffff"/>
      <text x="336" y="225" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">CANVAS FEED</text>

      <!-- 6. Canvas Compositor -> REST API (Submit Foto & Ucapan) -->
      <path d="M 660,325 V 360"
            fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-accent)"/>
      <rect x="668" y="335" width="58" height="13" rx="2" fill="#ffffff"/>
      <text x="697" y="345" fill="#2563eb" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">POST ENTRY</text>

      <!-- 7. REST API -> PostgreSQL (Simpan data entri & booking) -->
      <path d="M 725,390 H 785 Q 795,390 795,380 V 230 Q 795,220 805,220 H 830"
            fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
      <rect x="760" y="300" width="70" height="13" rx="2" fill="#ffffff"/>
      <text x="795" y="310" fill="#059669" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">SQL INSERT</text>

      <!-- 8. REST API -> Media Storage (Simpan file gambar PNG & audio WebM) -->
      <path d="M 725,410 H 830"
            fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="746" y="415" width="76" height="13" rx="2" fill="#ffffff"/>
      <text x="784" y="425" fill="#475569" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">UPLOAD MEDIA</text>

      <!-- ========================================================================= -->
      <!-- NODES: TIER 1 CLIENT                                                      -->
      <!-- ========================================================================= -->

      <!-- Node 1: Guest Smartphone -->
      <rect x="55" y="90" width="200" height="110" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.22)" stroke-width="1"/>
      <rect x="63" y="98" width="42" height="12" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="84" y="107" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CLIENT</text>
      <text x="245" y="108" fill="rgba(15, 23, 42, 0.10)" font-size="18" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="700">01</text>
      <text x="75" y="132" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Guest Smartphone</text>
      <text x="75" y="148" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• QR Code PWA (No App)</text>
      <text x="75" y="162" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• WebRTC Video &amp; Mic</text>
      <text x="75" y="176" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">Viewport: 360–430px</text>

      <!-- Node 2: Admin Dashboard -->
      <rect x="55" y="315" width="200" height="110" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.22)" stroke-width="1"/>
      <rect x="63" y="323" width="46" height="12" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="86" y="332" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">OPERATOR</text>
      <text x="245" y="333" fill="rgba(15, 23, 42, 0.10)" font-size="18" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="700">02</text>
      <text x="75" y="357" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Admin Dashboard</text>
      <text x="75" y="373" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• Event &amp; Frame Config</text>
      <text x="75" y="387" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• Live Monitor &amp; Export</text>
      <text x="75" y="401" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">Protected UI (≥768px)</text>

      <!-- ========================================================================= -->
      <!-- NODES: TIER 2 APPLICATION                                                 -->
      <!-- ========================================================================= -->

      <!-- Node 3: Edge Security Middleware (Focal Accent) -->
      <rect x="345" y="90" width="400" height="95" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <rect x="353" y="98" width="58" height="12" rx="2" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(37, 99, 235, 0.40)" stroke-width="0.8"/>
      <text x="382" y="107" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">EDGE GUARD</text>
      <text x="735" y="108" fill="rgba(37, 99, 235, 0.12)" font-size="18" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="700">SEC</text>
      <text x="365" y="130" fill="#0f172a" font-size="13.5" font-weight="600" font-family="'Geist', sans-serif">Edge Middleware &amp; Security Gate</text>
      <text x="365" y="146" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• HMAC SHA-256 Session Cookie (HttpOnly · Anti-XSS)</text>
      <text x="365" y="160" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• Route Guard: /admin/* &amp; Destructive API Endpoints (401)</text>
      <text x="365" y="174" fill="#2563eb" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="500">• Brute-Force Throttler (Max 5 attempts / 15m)</text>

      <!-- Node 4: Server Components -->
      <rect x="345" y="230" width="195" height="95" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="353" y="238" width="36" height="12" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="371" y="247" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">SSR</text>
      <text x="365" y="270" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif">SSR Event Engine</text>
      <text x="365" y="286" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">• Dynamic Slug Routing</text>
      <text x="365" y="300" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">• Pre-render Hydration</text>
      <text x="365" y="314" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">app/event/[slug]/page.tsx</text>

      <!-- Node 5: Canvas Compositor -->
      <rect x="550" y="230" width="195" height="95" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.20)" stroke-width="1"/>
      <rect x="558" y="238" width="46" height="12" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="581" y="247" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CLIENT-JS</text>
      <text x="570" y="270" fill="#0f172a" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif">Canvas Compositor</text>
      <text x="570" y="286" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">• HTML5 Canvas 2D Engine</text>
      <text x="570" y="300" fill="#475569" font-size="8.5" font-family="'Geist Mono', monospace">• 3-Shot Strip Frame Merger</text>
      <text x="570" y="314" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace">Base64 Output Compression</text>

      <!-- Node 6: REST API Route Handlers -->
      <rect x="345" y="360" width="400" height="100" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.25)" stroke-width="1"/>
      <rect x="353" y="368" width="56" height="12" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="381" y="377" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">REST API</text>
      <text x="365" y="400" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Backend API Route Handlers</text>
      <text x="365" y="416" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• POST /api/events/[slug]/entries (Input Sanitizer &amp; Payload Guard)</text>
      <text x="365" y="430" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• GET /api/events/[slug]/entries (Live Gallery Real-Time Fetch)</text>
      <text x="365" y="444" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• POST /api/bookings · GET/PUT /api/events · /api/admin/*</text>

      <!-- ========================================================================= -->
      <!-- NODES: TIER 3 DATA & STORAGE                                              -->
      <!-- ========================================================================= -->

      <!-- Node 7: PostgreSQL Database (Focal Node) -->
      <rect x="835" y="145" width="250" height="135" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <rect x="843" y="153" width="52" height="12" rx="2" fill="rgba(5, 150, 105, 0.08)" stroke="rgba(5, 150, 105, 0.40)" stroke-width="0.8"/>
      <text x="869" y="162" fill="#059669" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">POSTGRES</text>
      <text x="1075" y="164" fill="rgba(5, 150, 105, 0.12)" font-size="18" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="700">DB</text>
      <text x="855" y="185" fill="#0f172a" font-size="13.5" font-weight="600" font-family="'Geist', sans-serif">PostgreSQL (Supabase DB)</text>
      <text x="855" y="202" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">📁 events (Event Settings &amp; Frames)</text>
      <text x="855" y="217" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">📁 gallery_entries (Photos &amp; Wishes)</text>
      <text x="855" y="232" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">📁 bookings (Customer Reservations)</text>
      <text x="855" y="247" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">📁 packages (Pricing &amp; Quotas)</text>
      <text x="855" y="265" fill="#059669" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="500">Foreign Key: event_id (Isolation)</text>

      <!-- Node 8: Media Object Storage -->
      <rect x="835" y="325" width="250" height="135" rx="6" fill="#ffffff" stroke="rgba(15, 23, 42, 0.22)" stroke-width="1"/>
      <rect x="843" y="333" width="58" height="12" rx="2" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.15)" stroke-width="0.8"/>
      <text x="872" y="342" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">S3 / STORAGE</text>
      <text x="1075" y="344" fill="rgba(15, 23, 42, 0.10)" font-size="18" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="700">CDN</text>
      <text x="855" y="367" fill="#0f172a" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Media Object Storage</text>
      <text x="855" y="386" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">Bucket: 'ruangtemu-media'</text>
      <text x="855" y="401" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• /photos/{eventId}/{uuid}.png</text>
      <text x="855" y="416" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• /audio/{eventId}/{uuid}.webm</text>
      <text x="855" y="431" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">• /frames/{uuid}.png</text>
      <text x="855" y="448" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace">Fast Edge CDN Delivery</text>

      <!-- ========================================================================= -->
      <!-- LEGEND BAR                                                                -->
      <!-- ========================================================================= -->
      <line x1="30" y1="525" x2="1110" y2="525" stroke="rgba(15, 23, 42, 0.10)" stroke-width="0.8"/>
      <text x="30" y="546" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">LEGENDA ARSITEKTUR</text>

      <rect x="180" y="538" width="12" height="10" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="198" y="546" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Security / Gatekeeper</text>

      <rect x="335" y="538" width="12" height="10" rx="2" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <text x="353" y="546" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Database Relasional</text>

      <rect x="480" y="538" width="12" height="10" rx="2" fill="#ffffff" stroke="rgba(15, 23, 42, 0.22)" stroke-width="1"/>
      <text x="498" y="546" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">App Service / Storage</text>

      <line x1="640" y1="543" x2="665" y2="543" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-accent)"/>
      <text x="672" y="546" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">HTTPS Client Request</text>

      <line x1="800" y1="543" x2="825" y2="543" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
      <text x="832" y="546" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">SQL Transaction (lib/db.ts)</text>

      <line x1="975" y1="543" x2="1000" y2="543" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
      <text x="1008" y="546" fill="#475569" font-size="8.5" font-family="'Geist', sans-serif">Data Stream / Internal</text>
    </svg>